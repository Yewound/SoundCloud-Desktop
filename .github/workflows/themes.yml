name: Themes
on:
  pull_request:
    paths: ['themes/**', 'desktop/src/lib/themes/**', '.github/workflows/themes.yml']
  push:
    branches: [main]
    paths: ['themes/**', 'desktop/src/lib/themes/**', '.github/workflows/themes.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: git fetch origin refs/heads/themes-dist:refs/remotes/origin/themes-dist || true
      - run: node --experimental-strip-types --test 'themes/tools/*.test.mjs'
      - run: node --experimental-strip-types themes/tools/check.mjs --previous origin/themes-dist --pr-author "$PR_AUTHOR"
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      - name: Render previews
        run: |
          (cd desktop && pnpm install --frozen-lockfile && pnpm exec vite build --outDir "$RUNNER_TEMP/app" --emptyOutDir)
          mkdir -p "$RUNNER_TEMP/previews"
          node --experimental-strip-types themes/tools/preview/render.mjs --dist "$RUNNER_TEMP/app" --out "$RUNNER_TEMP/previews"
      - uses: actions/upload-artifact@v7
        with:
          name: theme-previews
          path: ${{ runner.temp }}/previews
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: themes-publish
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: git fetch origin refs/heads/themes-dist:refs/remotes/origin/themes-dist || true
      - id: missing
        run: echo "ids=$(node --experimental-strip-types themes/tools/preview/render.mjs --list --missing)" >> "$GITHUB_OUTPUT"
      - name: Render missing previews
        if: steps.missing.outputs.ids != ''
        env:
          IDS: ${{ steps.missing.outputs.ids }}
        run: themes/tools/preview/commit-missing.sh
      - id: build
        run: |
          set +e
          rev=$(git rev-parse HEAD)
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          node --experimental-strip-types themes/tools/build.mjs --rev "$rev" --previous origin/themes-dist --out "$RUNNER_TEMP/dist"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - if: steps.build.outputs.code == '0' || steps.build.outputs.code == '3'
        working-directory: ${{ runner.temp }}/dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REV: ${{ steps.build.outputs.rev }}
        run: |
          git init -q -b themes-dist
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "themes ${REV::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" themes-dist
      - if: steps.build.outputs.code != '0'
        run: exit 1
